# Gradle build JVM settings.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft / NeoForge toolchain.
# The Minecraft version must agree with the NeoForge version to get a valid artifact.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Latest 1.21.1 NeoForge at scaffold time; bump freely.
neo_version=21.1.252
loader_version_range=[1,)

# Parchment gives readable parameter names + javadoc in the dev environment.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod metadata (inlined into neoforge.mods.toml by generateModMetadata).

# Must be lowercase, match [a-z][a-z0-9_]{1,63}, and match EldritchHorror.MODID.
mod_id=eldritch_horror
mod_name=Eldritch Horror
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.sanchous98.eldritchhorror
mod_authors=Sanchous98
mod_description=An RPG-flavoured eldritch horror mod: sanity, corruption, cults, forbidden rituals, and things that should not be.
