# Dev environment for Eldritch Horror (Minecraft 26.3 / NeoForge).
#
#   docker compose run --rm dev ./gradlew build
#   docker compose run --rm dev ./gradlew runData
#   docker compose run --rm dev bash
#
# The repo is bind-mounted at /workspace, so edits on the host are seen instantly.
# The Gradle cache lives in a named volume, so Minecraft/NeoForge decompilation is
# downloaded and kept **once** (~1 GB) instead of on every run.
#
# The dev client (runClient) needs a display + GPU; see the `gpu` profile at the
# bottom and the "Dev client on Linux" section of the README.
name: eldritch-horror-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: eldritch-horror-dev:latest
    init: true
    working_dir: /workspace
    # Keep Gradle + the first-build decompiler bounded. The decompiler forks its own JVM
    # with a hardcoded -Xmx4096m, so mem_limit must exceed the Gradle heap by ~4.5 GB or
    # it is OOM-killed ("Node action for decompile failed"). Raise DEV_MEM if needed.
    cpus: ${DEV_CPUS:-3}
    mem_limit: ${DEV_MEM:-8g}
    volumes:
      - .:/workspace
      - gradle-cache:/home/dev/.gradle
    environment:
      GRADLE_USER_HOME: /home/dev/.gradle
      # Gradle heap. The decompiler forks separately (4 GB), so keep this modest.
      JAVA_TOOL_OPTIONS: "${DEV_JAVA_XMX:--Xmx1g}"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      # Uncomment to force the exact host UID/GID if the bind mount is not writable:
      # HOST_UID: ${UID:-1000}
    # `docker compose run --rm dev` is the normal entry point. `up -d` keeps an
    # idle container you can `exec` into:
    #   docker compose up -d dev && docker compose exec dev bash
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # Dedicated dev server — connect with your normal Minecraft client on 1.21.11/26.3.
  #
  #   docker compose --profile server up server
  #   # then in your client: Multiplayer -> Direct Connect -> localhost:25565
  #
  # The server runs `./gradlew runServer`, which builds the mod and starts NeoForge.
  # World/data live in ./run (bind-mounted via the repo mount). Port is published.
  # ---------------------------------------------------------------------------
  server:
    profiles: ["server"]
    extends:
      service: dev
    command: ["./gradlew", "runServer", "--no-daemon", "--console=plain"]
    ports:
      - "${SERVER_PORT:-25565}:25565"
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # Dev client with a GPU + X11/Wayland display (Linux only).
  #
  #   xhost +si:localuser:$(id -un)   # allow the container to use your display
  #   docker compose --profile gpu run --rm dev-gpu ./gradlew runClient
  #
  # On Wayland, ensure XWayland is running; DISPLAY/XDG_RUNTIME_DIR are forwarded.
  # The `nvidia` section is opt-in: uncomment `deploy` if you have the NVIDIA
  # Container Toolkit, otherwise Docker uses your default GPU (often none/softpipe).
  # ---------------------------------------------------------------------------
  dev-gpu:
    profiles: ["gpu"]
    extends:
      service: dev
    environment:
      GRADLE_USER_HOME: /home/dev/.gradle
      JAVA_TOOL_OPTIONS: "-Xmx3g"
      DISPLAY: ${DISPLAY:-:0}
      XDG_RUNTIME_DIR: /tmp/xdg
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
    volumes:
      - .:/workspace
      - gradle-cache:/home/dev/.gradle
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XDG_RUNTIME_DIR:-/tmp/xdg}:/tmp/xdg:rw
    # For NVIDIA, install the container toolkit and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, graphics]

volumes:
  gradle-cache:
