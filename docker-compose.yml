# Dev environment for Eldritch Horror (Minecraft 26.3 / NeoForge).
#
# Source is COPIED into the image and all mutable state lives in NAMED VOLUMES — there is
# no host bind mount. This is deliberate: Docker Desktop on Windows cannot share C:\ paths
# (host_mnt read-only / 9p I/O errors), so bind mounts are avoided on every OS for a setup
# that behaves identically everywhere.
#
#   docker compose build dev                              # build the toolchain (JDK 25)
#   docker compose run --rm dev ./gradlew build           # build the mod
#   docker compose run --rm dev ./gradlew runData         # datagen
#   docker compose --profile server up server             # dedicated server on :25565
#   docker compose run --rm dev bash                       # a shell
#
# Rebuild after changing code:  docker compose build dev   (or `--build` on `up`).
name: eldritch-horror-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: eldritch-horror-dev:latest
    init: true
    working_dir: /workspace
    # The decompiler forks a hardcoded 4 GB JVM; keep the container above that + overhead.
    cpus: ${DEV_CPUS:-3}
    mem_limit: ${DEV_MEM:-8g}
    volumes:
      # Mutable state only — never the source tree.
      - gradle-cache:/home/dev/.gradle    # Gradle + NeoForge cache (the big first-build decompile)
      - build-out:/workspace/build        # compiled output, kept across `run --rm`
      - run-data:/workspace/run           # dev server world + server.properties
    environment:
      GRADLE_USER_HOME: /home/dev/.gradle
      JAVA_TOOL_OPTIONS: "${DEV_JAVA_XMX:--Xmx1g}"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # Dedicated dev server — connect with your normal Minecraft client (26.3).
  #
  #   docker compose --profile server up server
  #   # then: Multiplayer -> Direct Connect -> localhost:25565
  #
  # World and server.properties persist in the `run-data` volume. To edit them, either
  # `docker compose run --rm dev bash` (they are at /workspace/run) or copy in/out with
  # `docker cp`. Port is published.
  # ---------------------------------------------------------------------------
  server:
    profiles: ["server"]
    extends:
      service: dev
    command: ["./gradlew", "runServer", "--no-daemon", "--console=plain"]
    ports:
      - "${SERVER_PORT:-25565}:25565"
    environment:
      GRADLE_USER_HOME: /home/dev/.gradle
      JAVA_TOOL_OPTIONS: "${DEV_JAVA_XMX:--Xmx1g}"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      # Auto-op on join and other dev conveniences (see core/DevTools).
      EH_DEV: "true"
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # Dev client with a GPU + X11/Wayland display (Linux only; needs the X11/GL libs,
  # which Dockerfile.dev installs). Windows/macOS: run the client natively instead.
  #
  #   xhost +si:localuser:$(id -un)
  #   docker compose --profile gpu run --rm dev-gpu ./gradlew runClient
  # ---------------------------------------------------------------------------
  dev-gpu:
    profiles: ["gpu"]
    extends:
      service: dev
    environment:
      GRADLE_USER_HOME: /home/dev/.gradle
      JAVA_TOOL_OPTIONS: "${DEV_JAVA_XMX:--Xmx2g}"
      DISPLAY: ${DISPLAY:-:0}
      XDG_RUNTIME_DIR: /tmp/xdg
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
    volumes:
      - gradle-cache:/home/dev/.gradle
      - build-out:/workspace/build
      - run-data:/workspace/run
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XDG_RUNTIME_DIR:-/tmp/xdg}:/tmp/xdg:rw
    # For NVIDIA: install the container toolkit and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, graphics]

volumes:
  gradle-cache:
  build-out:
  run-data:
