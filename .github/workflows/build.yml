name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # First run decompiles Minecraft (~5 min, ~4 GB); allow plenty of headroom.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Manages ~/.gradle caching (dependencies, wrapper, NeoForge/Minecraft
      # decompile cache) and injects the Gradle Enterprise build scan/daemon config.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Build (compile + test)
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: eldritch-horror-jar
          path: build/libs/*.jar
          if-no-files-found: error
