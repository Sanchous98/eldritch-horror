name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One release at a time per tag; never cancel a publish halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      # A release must pass the same gates as CI: JUnit + PMD are part of build.
      - name: Build (compile + JUnit + PMD)
        run: ./gradlew build --no-daemon --console=plain

      - name: Checksum the jar
        run: |
          set -euo pipefail
          jar="$(ls build/libs/eldritch_horror-*.jar | head -n 1)"
          echo "JAR=$jar" >> "$GITHUB_ENV"
          (cd build/libs && sha256sum "$(basename "$jar")") > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$JAR#$(basename "$JAR")" \
            SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # Manual dispatch has no tag: still produce the installable artifact.
      - name: Upload jar (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: eldritch-horror-release
          path: |
            build/libs/*.jar
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/pmd/
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
