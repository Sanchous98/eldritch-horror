plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id 'pmd'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.3, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    // Add extra repositories here as dependencies are introduced.
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

neoForge {
    version = project.neo_version

    // Access transformers are auto-detected at src/main/resources/META-INF/accesstransformer.cfg.
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // Bind the source set to the mod id so the game knows which sources are ours.
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime' is a dependency present at runtime for testing but not propagated
// to dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional integrations (e.g. JEI/EMI) go here as compileOnly + localRuntime.
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Expands ${...} placeholders in the neoforge.mods.toml template from gradle.properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Static analysis (PMD 7): catches the dead/redundant code an IDE flags — unused private
// members, always-true/false conditions, useless parentheses/returns, unused imports. It runs
// as its own task (`./gradlew pmdMain`), never as part of `build`, and does not fail the build:
// read the report at build/reports/pmd/main.html and act on it deliberately.
pmd {
    toolVersion = '7.28.0'
    ruleSets = [] // no default rulesets; use only the explicit ruleset below
    ruleSetFiles = files("config/pmd/ruleset.xml")
}

tasks.named('pmdMain') {
    // Our own sources only; the Minecraft/NeoForge jars are not analysed. Mixins are excluded:
    // their `eldritchhorror$…` methods are invoked by the mixin framework, not from Java, so PMD
    // reports them as unused (a false positive).
    source = fileTree('src/main/java') { exclude '**/mixin/**' }
    ignoreFailures = true
    consoleOutput = true
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
